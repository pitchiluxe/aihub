<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="icon" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Brain / neural network icon, centered -->
  <g filter="url(#glow)" transform="translate(12, 12)">
    <!-- Left brain lobe -->
    <path d="M20 8 C14 8 10 12 10 17 C10 20 11.5 22.5 14 24 C13 25 12.5 26.5 13 28 C13.5 29.5 15 30.5 17 30.5 L20 30.5" 
          stroke="url(#icon)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Right brain lobe -->
    <path d="M20 8 C26 8 30 12 30 17 C30 20 28.5 22.5 26 24 C27 25 27.5 26.5 27 28 C26.5 29.5 25 30.5 23 30.5 L20 30.5" 
          stroke="url(#icon)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Center line (corpus callosum) -->
    <line x1="20" y1="10" x2="20" y2="30.5" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <!-- Neural node dots -->
    <circle cx="14.5" cy="18" r="1.8" fill="white" opacity="0.9"/>
    <circle cx="25.5" cy="18" r="1.8" fill="white" opacity="0.9"/>
    <circle cx="13.5" cy="25" r="1.4" fill="white" opacity="0.7"/>
    <circle cx="26.5" cy="25" r="1.4" fill="white" opacity="0.7"/>
    <circle cx="20" cy="14" r="1.6" fill="white" opacity="0.9"/>
    <!-- Sparkle top-right -->
    <path d="M30 5 L31.2 8.8 L35 10 L31.2 11.2 L30 15 L28.8 11.2 L25 10 L28.8 8.8 Z" 
          fill="white" opacity="0.95"/>
    <!-- Small dot sparkle -->
    <circle cx="34" cy="6" r="1.1" fill="white" opacity="0.7"/>
    <circle cx="36" cy="10" r="0.7" fill="white" opacity="0.5"/>
  </g>

  <!-- Bottom label "AI" small subtle -->
  <text x="32" y="57" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-size="8" font-weight="700" fill="rgba(255,255,255,0.55)" letter-spacing="1.5">AI</text>
</svg>
